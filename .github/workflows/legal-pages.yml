name: Publish legal and support pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "legal-site/**"
      - ".github/workflows/legal-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legal-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legal-site
      - name: Deploy legal site
        id: deployment
        uses: actions/deploy-pages@v4
